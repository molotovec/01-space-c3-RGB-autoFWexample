; ESP-01 (ESP8266) - video switch PWM controller
; Standalone WiFi AP with a webserver to switch CM1/CM2/CM3 channels
; and set a custom PWM pulse width (1000-2000us @ 50Hz).
;
; ESP-01 modules ship with either 512KB flash (use board = esp01) or
; 1MB flash (use board = esp01_1m, the more common variant nowadays).

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; ESP-01 has no onboard USB; flash it via an external USB-TTL adapter
; wired to TX/RX/GND/VCC, with GPIO0 pulled low during upload.
; Uncomment and set the correct port if auto-detection doesn't work:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
