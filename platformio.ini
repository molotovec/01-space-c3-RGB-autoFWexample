; 01Space ESP32-C3FH4-RGB ("Bedazzled") - 5x5 WS2812B grid
; Board: ESP32-C3, 4MB flash, native USB-CDC
; WiFi-station web server with 3 color buttons (Yellow / Blue / Green)

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbmodem144401
monitor_port = /dev/cu.usbmodem144401
board_build.flash_size = 4MB

build_flags =
    ; --- native USB serial (this board has no separate UART bridge) ---
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
